# Home Manager decrypts secrets/homes/<host>.yaml at login with a passphrase-free
# machine age key, so those files hold only secrets alex's processes read anyway.
# Make one on a new host:
# mkdir -p ~/.config/sops/age
# (umask 077; age-keygen -o ~/.config/sops/age/home-manager.txt)

# Display the SSH-derived user public age key:
# ssh-to-age -i ~/.ssh/id_ed25519.pub
# Interactive sops derives its identity on demand and prompts for the SSH passphrase.

# Make a host public key:
# nix-shell -p ssh-to-age
# ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub

# Add or edit secrets
# sops secrets/hosts/<host>.yaml

# Rekey a secrets file after editing recipients in .sops.yaml:
# sops updatekeys secrets/hosts/<host>.yaml
keys:
  - &users:
    - &alex_ssh age15gjn34qpz83h9s5272tf5p8ww0rnyxnhmt7jjawd475erm8nn42sdnz5mu
    - &alex_sonic_home age1yng8uexat0xqyk0u7z0g85jgsta48tx9m87x7vmuq62wawcktpmsxdaxxu
  - &host:
    - &frostmourne age1kjqhsyucjhuw6gazjrjqcuavay6pfgpr8fasltft99vzfdkjdsdsvfx4xv
    - &palantir age1ajyn9l0v2fv5kyhdzvkr4dxw6rm602w06sk3qnxz5d7aj67ygy0qv4drf9
    - &sonic age1tksd8m2p4cup3mlknft7e7yrcyv0av5duyf2h0r4d2qza07ajgzqxe0h57
creation_rules:
  - path_regex: ^secrets/suites/kubernetes\.ya?ml$
    key_groups:
      - age:
          - *frostmourne
          - *alex_ssh
  - path_regex: ^secrets/hosts/palantir\.ya?ml$
    key_groups:
      - age:
          - *palantir
          - *alex_ssh

  - path_regex: ^secrets/hosts/sonic\.ya?ml$
    key_groups:
      - age:
          - *sonic
          - *alex_ssh

  - path_regex: ^secrets/homes/sonic\.ya?ml$
    key_groups:
      - age:
          - *alex_sonic_home
          - *alex_ssh
