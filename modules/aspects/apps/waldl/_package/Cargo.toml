[package]
name = "waldl"
version = "0.1.0"
edition = "2024"
description = "Wallhaven wallpaper browser TUI"

[dependencies]
# TUI — pinned to 0.30 to match ratatui-image
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# Wallhaven serves JPEG and PNG; avoid compiling every image codec.
ratatui-image = { version = "10", default-features = false, features = [
    "crossterm",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Async runtime
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
] }
futures = "0.3"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Paths
directories = "6"
dirs = "5"

# Errors
anyhow = "1"

# Misc
md5 = "0.7"
chrono = "0.4"
shellexpand = "3"
libc = "0.2"

[profile.release]
strip = true
