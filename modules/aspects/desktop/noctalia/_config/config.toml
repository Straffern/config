# Declarative Noctalia config. GUI changes land in settings.toml beside this file.
# https://docs.noctalia.dev/noctalia/configuration/

[shell]
polkit_agent = true
# Own cgroup per app: logout/shell restarts don't wait on or kill launched apps.
launch_apps_as_systemd_services = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[lockscreen]
fingerprint = true
